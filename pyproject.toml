[project]
name = "matcalc"
authors = [
    { name = "Runze Liu", email = "rul048@ucsd.edu" },
    { name = "Eliott Liu", email = "elliottliu17@gmail.com" },
    { name = "Ji Qi", email = "j1qi@ucsd.edu" },
    { name = "Shyue Ping Ong", email = "shyue@nus.edu.sg" },
    { name = "Tsz Wai Ko", email = "t1ko@ucsd.edu" },
]
description = "The MatCalc benchmarks (equilibrium, elasticity, phonon, softening) for machine-learning interatomic potentials."
readme = "README.md"
requires-python = ">=3.12"
keywords = ["benchmark", "interatomic potential", "machine learning", "materials", "phonon", "elasticity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "ase>=3.26.0",
    "huggingface-hub>=0.30.0",
    "monty",
    "numpy",
    "pandas",
    "phonopy>=4.2.0",
    "pymatgen>=2026.3.23",
    "tqdm",
]
version = "0.5.1"

[project.optional-dependencies]
# Structural distance d of the Equilibrium benchmark.
benchmark = ["matminer>=0.10.1"]
# The MACE models used to validate this fork (matcalc.load_mace).
mace = ["mace-torch>=0.3.16"]
# Batched GPU simulator (matcalc.simulation.TorchSimSimulator). 0.6.2 fixed FIRE with cell filters.
torchsim = ["torch-sim-atomistic>=0.6.2"]
test = ["pytest>=8.3.5", "matminer>=0.10.1"]

[project.scripts]
matcalc-bench = "matcalc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["matcalc", "matcalc.*"]

[tool.setuptools.package-data]
"matcalc" = ["elemental_refs/*.json.gz", "py.typed"]

[build-system]
requires = ["setuptools>=58.0.3"]
build-backend = "setuptools.build_meta"

[dependency-groups]
lint = ["mypy>=1.15.0", "ruff>=0.11.2"]

[tool.ruff]
line-length = 120
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",
    "COM812", # trailing comma missing
    "D205", # 1 blank line required between summary line and description
    "D212", # Multi-line docstring summary should start at the first line
    "EM101",
    "EM102",
    "ISC001",
    "PLR0913", # too many arguments
    "PLW0603", # Using the global statement to update variables is discouraged
    "PTH", # prefer Path to os.path
    "SIM105", # Use contextlib.suppress(OSError) instead of try-except-pass
    "TRY003",
    "PLC0415",
    "CPY001",
    "PLR0917"
]
pydocstyle.convention = "google"
isort.required-imports = ["from __future__ import annotations"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["ARG002", "D", "SLF001", "FBT001", "INP001", "N802", "N803", "PLR2004", "S101"]

[tool.pytest.ini_options]
addopts = "--durations=15 --quiet -rXs --color=yes -p no:warnings"
markers = [
    "mace: needs mace-torch and downloads a MACE model (run on a GPU node)",
    "network: downloads benchmark data from Hugging Face",
]

[tool.mypy]
ignore_missing_imports = true
explicit_package_bases = true
no_implicit_optional = false
exclude = ['tests']

[[tool.mypy.overrides]]
module = ["requests.*", "tabulate.*"]
ignore_missing_imports = true

[tool.codespell]
ignore-words-list = "mater,te,nd,Commun,ontop"
check-filenames = true

[tool.coverage.run]
relative_files = true

[tool.coverage.report]
exclude_lines = [
    "@deprecated",
    "def __repr__",
    "except PackageNotFoundError:",
    "except Exception:",
    "except:",
    "except FileNotFoundError:",
    "if 0:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "if self.debug:",
    "if settings.DEBUG",
    "input",
    "pragma: no cover",
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.pyright]
reportMissingImports = false
reportMissingModuleSource = false
reportPossiblyUnboundVariable = true
reportUnboundVariable = true
exclude = ["tests"]
