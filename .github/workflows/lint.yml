name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -e .
          pip install ruff mypy

      - name: ruff
        run: |
          ruff --version
          ruff check src tests
          ruff format src tests --check

      - name: mypy
        run: |
          mypy --version
          rm -rf .mypy_cache
          mypy -p matcalc
